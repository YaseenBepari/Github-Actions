<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yaseen | GitHub Actions Demo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
    }

    .container {
      text-align: center;
      padding: 50px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 700px;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 20px;
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .status {
      display: inline-block;
      padding: 12px 25px;
      background: #22c55e;
      border-radius: 30px;
      font-weight: bold;
    }

    .tech {
      margin-top: 30px;
      font-size: 16px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 Welcome!</h1>

    <h2>GitHub Actions Deployment</h2>

    <p>
      Hello, I'm <strong>Yaseen</strong> 👋
    </p>

    <p>
      This website was automatically deployed to
      <strong>Amazon S3</strong> using a
      <strong>GitHub Actions CI/CD Pipeline.</strong>
    </p>

    <div class="status">
      ✓ Deployment Successful
    </div>

    <div class="tech">
      GitHub → GitHub Actions → AWS → Amazon S3
    </div>

  </div>

</body>
</html>
